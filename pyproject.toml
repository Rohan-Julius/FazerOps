[project]
name = "fazerops"
version = "0.1.0"
description = "The change ledger for everything that didn't go through CI — and an agent that reads it when the page fires."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.20"]
cluster = ["kubernetes>=30.1"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fazerops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "cluster: requires a running k3d cluster (excluded from the CI default suite)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
