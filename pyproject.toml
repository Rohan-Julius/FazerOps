[project]
name = "fazerops"
version = "0.1.0"
description = "The change ledger for everything that didn't go through CI — and an agent that reads it when the page fires."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
slack = [
    "slack-bolt>=1.20",
]
cluster = ["kubernetes>=30.1"]
# The active inference path (plan §9.2). An extra rather than a core dependency: the
# fixture + stub quickstart a judge runs must not need it, and `uv sync` without this extra
# is the clean-machine path W30 verifies. It was installed ad hoc until 12 Sep, which meant
# a `uv sync` silently removed it and took the Gemini path down with it.
gemini = ["google-genai>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fazerops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `.` as well as `src`, because `agentcore_app.py` lives at the repo root — that is where
# `agentcore configure --entrypoint` expects the file it containerizes, and it is the shape
# every example in the AWS docs uses.
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "cluster: requires a running k3d cluster (excluded from the CI default suite)",
    "github: requires network access to api.github.com and FAZEROPS_GITHUB_TEST_REPO (excluded from the CI default suite). Read-only and free.",
    "aws: requires live AWS credentials (excluded from the CI default suite). Read-only and free \u2014 lookup_events on management events is not metered, and nothing under this marker may create a resource.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
