# W1a. The default ruleset, plus a narrow allowlist for three deliberate non-secrets.
#
# Each entry below is here because the string is *supposed* to look like a credential.
# Nothing is allowlisted to make a real finding go away — if this file ever grows an entry
# whose justification is "it kept failing", that is the bug, not the scanner.

[extend]
useDefault = true

[allowlist]
description = "Build artifacts and fixtures that exist precisely to resemble credentials"

paths = [
  # Compiled bytecode mirrors the source it came from, including this repo's synthetic
  # credential samples. Gitignored, so it is never committed; it only appears under
  # `gitleaks detect --no-git`, which scans the working tree.
  '''__pycache__''',
  '''\.venv/''',

  # W7's k3d cluster writes its audit log here, and a real API server's audit stream
  # genuinely contains bootstrap tokens and certificate material — these are *live*
  # findings, not false positives. The directory is gitignored and regenerated by
  # `scripts/setup_k3d.sh`, so nothing in it can reach a commit; this entry keeps
  # `gitleaks detect --no-git` (which scans the working tree, .gitignore and all) from
  # going red every time the cluster is up. Never copy a raw entry out of this directory
  # into `fixtures/` without stripping it — W7b takes only the six demo events.
  '''\.k3d/''',

  # `scripts/demo_world.py` mints client certificates for its three k3d identities (priya, arun,
  # dinesh) through the cluster's CSR API and keeps the keys in `.fazerops/demo-world/`. Real keys,
  # like `.k3d/` above — but only for the throwaway local cluster, regenerated when missing, and the
  # directory is gitignored (`tests/test_no_secrets.py::test_fazerops_state_is_gitignored` fails if
  # that rule is ever removed). First surfaced 14 Sep, the day the demo story ran live.
  '''\.fazerops/demo-world/''',

  # `.env` holds real credentials — a Gemini API key, and Slack tokens later. That is what
  # the file is *for*, and it is gitignored, so nothing in it can reach a commit. Like
  # `.k3d/` above it only surfaces under `gitleaks detect --no-git`, which scans the
  # working tree regardless of .gitignore.
  #
  # **This entry is only safe while `.env` stays gitignored, and that premise is enforced,
  # not assumed:** `tests/test_no_secrets.py::test_dotenv_is_gitignored` fails if the
  # ignore rule is ever removed. Without that interlock this allowlist would be the exact
  # thing the header above forbids.
  #
  # Left un-allowlisted, the documented pre-push command goes red for every developer who
  # has a working `.env` — and a check that cries wolf is a check people stop reading.
  '''\.env$''',

  # tests/test_no_secrets.py carries one synthetic sample per credential pattern, so that
  # a regex which matches nothing cannot pass the scan for the wrong reason. Allowlisting
  # the file is what lets that test exist at all.
  '''tests/test_no_secrets\.py''',
]

regexes = [
  # fixtures/k8s_audit/billing_window.json — a fake base64 Secret value, present to prove
  # the K8s collector redacts secret material rather than putting it in a Slack message.
  # `test_secret_values_are_redacted_but_the_rotation_is_still_reported` asserts the
  # collector never emits it.
  '''c3VwZXJzZWNyZXQtcm90YXRlZA==''',
]
