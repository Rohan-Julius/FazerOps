# W7a — the demo workload. Everything the scenario acts on has to exist as a real object:
# without this there is nothing to `kubectl edit`, W24's executor has no ConfigMap to read
# back, and the video's central action has no target.
#
# The names are not decorative — they must match `config/service_manifest.yaml`'s
# `billing-api` entry exactly, or the collected event will not resolve into the blast
# radius it belongs to.
apiVersion: v1
kind: Namespace
metadata:
  name: billing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-api-config
  namespace: billing
data:
  # Idea §7: the demo edit is `pool.max: "100" -> "20"`. This is the pre-incident state,
  # so the cluster starts where the story starts.
  pool.max: "100"
  pool.min: "5"
  timeout: "30s"
---
apiVersion: v1
kind: Secret
metadata:
  name: billing-api-db
  namespace: billing
type: Opaque
stringData:
  # Not a credential: a fixed placeholder so the redaction path (collectors/k8s_audit.py
  # rewrites Secret diff values to `<redacted>`) has a real Secret to exercise on a real
  # cluster. Nothing reads this value.
  password: "not-a-real-password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: billing
  labels:
    app: billing-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      containers:
        - name: billing-api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          # The ConfigMap is mounted rather than injected as env so that an edit is a
          # plausible thing for an on-call engineer to do by hand at 14:03.
          volumeMounts:
            - name: config
              mountPath: /etc/billing-api
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: billing-api-config
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api
  namespace: billing
spec:
  selector:
    app: billing-api
  ports:
    - port: 80
      targetPort: 80
