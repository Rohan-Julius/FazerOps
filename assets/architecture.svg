<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="t d">
<title id="t">FazerOps architecture</title>
<desc id="d">An alert starts a read-only investigation in one Strands Graph: an orchestrator agent, four deterministic collectors in one concurrent batch, a change ledger, Python scoring and a correlator agent produce a Brief. Only the Brief crosses the layer seam into automation, where a proposer agent selects a catalog action, a dry run and inverse are computed, a human approves on a Slack card, and a scoped executor runs it. Catalog growth mines gaps from production evidence.</desc>
<!-- Palette, five colours: ink #0f172a · white #ffffff · grey #e2e8f0 · agent #4f6d8a · seam #dc2626 -->
<style>
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
.h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.3px; }
.sub { font-size: 17px; }
.leg { font-size: 15px; font-weight: 600; }
.band { font-size: 15px; font-weight: 800; letter-spacing: 1.1px; }
.note { font-size: 14px; font-weight: 500; }
.t { font-size: 20px; font-weight: 800; text-anchor: middle; }
.t2 { font-size: 19px; font-weight: 800; text-anchor: middle; }
.ts { font-size: 17px; font-weight: 800; text-anchor: middle; }
.tg { font-size: 16px; font-weight: 800; text-anchor: middle; }
.lbl { font-size: 13.5px; font-weight: 700; }
.pill { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; text-anchor: middle; }
.w { fill: #ffffff; }
.py { fill: #ffffff; stroke: #0f172a; stroke-width: 2.5; }
.agent { fill: #4f6d8a; stroke: #0f172a; stroke-width: 2.5; }
.human { fill: #0f172a; stroke: #0f172a; stroke-width: 2.5; }
.store { fill: #e2e8f0; stroke: #0f172a; stroke-width: 2.5; }
.bandbox { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
.a { fill: none; stroke: #0f172a; stroke-width: 2.4; marker-end: url(#arr); }
.ad { fill: none; stroke: #0f172a; stroke-width: 2.4; stroke-dasharray: 7 5; marker-end: url(#arr); }
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<rect width="1600" height="1110" fill="#ffffff"/>

<!-- Header and legend -->
<text class="h1" x="40" y="58">FazerOps architecture</text>
<text class="sub" x="40" y="90">Tier 0 investigates on its own and changes nothing. Every mutation waits for a human approval.</text>
<rect x="642" y="42" width="26" height="16" fill="#4f6d8a" stroke="#0f172a" stroke-width="2"/>
<text class="leg" x="676" y="55">Agent · calls a model</text>
<rect x="889" y="42" width="26" height="16" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text class="leg" x="923" y="55">Python · deterministic</text>
<rect x="1145" y="42" width="26" height="16" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
<text class="leg" x="1179" y="55">Human decision</text>
<rect x="1331" y="42" width="26" height="16" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<text class="leg" x="1365" y="55">Store</text>
<line x1="1439" y1="50" x2="1465" y2="50" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 4"/>
<text class="leg" x="1473" y="55">Layer seam</text>

<!-- Investigation -->
<rect class="bandbox" x="270" y="110" width="1290" height="370"/>
<text class="band" x="290" y="140">INVESTIGATION · TIER 0 · READ-ONLY</text>
<text class="note" x="1540" y="140" text-anchor="end">one Strands Graph</text>

<rect class="py" x="40" y="170" width="205" height="100"/>
<text class="t" x="142.5" y="227">Alert webhook</text>

<rect x="40" y="320" width="205" height="100" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="8 5"/>
<text class="t2" x="142.5" y="364">Untrusted-data</text>
<text class="t2" x="142.5" y="388">envelope</text>
<path class="a" d="M142.5,270 V318"/>

<rect class="agent" x="295" y="170" width="230" height="100"/>
<text class="t w" x="410" y="227">orchestrator</text>
<path class="a" d="M245,370 H258 V220 H293"/>

<rect class="store" x="295" y="323" width="230" height="117"/>
<text class="t" x="410" y="388">Service manifest</text>
<path class="a" d="M410,323 V272"/>

<rect x="555" y="160" width="280" height="305" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="8 5"/>
<text class="tg" x="695" y="190">4 collectors · one batch</text>
<rect class="py" x="570" y="206" width="245" height="52"/>
<text class="ts" x="692.5" y="238">CloudTrail</text>
<rect class="py" x="570" y="270" width="245" height="52"/>
<text class="ts" x="692.5" y="302">Kubernetes audit log</text>
<rect class="py" x="570" y="334" width="245" height="52"/>
<text class="ts" x="692.5" y="366">Helm history</text>
<rect class="py" x="570" y="398" width="245" height="52"/>
<text class="ts" x="692.5" y="430">GitHub</text>
<path class="a" d="M525,220 H553"/>

<rect class="store" x="865" y="160" width="245" height="142"/>
<text class="t" x="987.5" y="238">Change ledger</text>
<path class="a" d="M835,238 H863"/>

<rect class="py" x="865" y="340" width="245" height="100"/>
<text class="t" x="987.5" y="397">Correlation scoring</text>
<path class="a" d="M987.5,302 V338"/>

<rect class="agent" x="1140" y="170" width="400" height="80"/>
<text class="t w" x="1340" y="217">correlator</text>
<path class="a" d="M1110,390 H1124 V210 H1138"/>

<rect x="1365" y="290" width="175" height="160" fill="#ffffff" stroke="#dc2626" stroke-width="4"/>
<rect x="1380.5" y="328" width="144" height="20" fill="#dc2626"/>
<text class="pill w" x="1452.5" y="342">SEAM CONTRACT</text>
<text class="t" x="1452.5" y="398" style="font-size:26px">Brief</text>
<path class="a" d="M1452.5,250 V288"/>

<rect class="py" x="1140" y="290" width="200" height="65"/>
<text class="ts" x="1240" y="328" style="font-size:15.5px">Coverage follow-up</text>
<rect class="py" x="1140" y="385" width="200" height="65"/>
<text class="ts" x="1240" y="423" style="font-size:15.5px">Slack change brief</text>
<path class="a" d="M1240,355 V383"/>
<path class="a" d="M1365,417 H1342"/>

<!-- The seam -->
<line x1="40" y1="505" x2="1560" y2="505" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 6"/>
<rect x="620" y="492" width="360" height="26" fill="#dc2626"/>
<text class="w" x="800" y="510" text-anchor="middle" style="font-size:13.5px;font-weight:800;letter-spacing:0.6px">THE SEAM · ONLY THE BRIEF CROSSES</text>

<!-- Automation -->
<rect class="bandbox" x="40" y="530" width="1520" height="250"/>
<text class="band" x="60" y="560">AUTOMATION · TIER 1 + TIER 2 · EVERY MUTATION WAITS FOR A HUMAN</text>
<text class="note" x="1420" y="560" text-anchor="end">reads right to left  ←</text>
<path d="M1452.5,450 V573" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrr)"/>

<rect class="agent" x="1290" y="575" width="245" height="100"/>
<text class="t w" x="1412.5" y="632">proposer</text>
<rect class="py" x="990" y="575" width="270" height="100"/>
<text class="t" x="1125" y="632">Typed action catalog</text>
<rect class="py" x="715" y="575" width="245" height="100"/>
<text class="t" x="837.5" y="632">Dry run + inverse</text>
<rect class="human" x="425" y="575" width="260" height="100"/>
<text class="t w" x="555" y="632">Slack approval card</text>
<rect class="py" x="65" y="575" width="330" height="100"/>
<text class="t" x="230" y="632">Scoped executor</text>
<path class="a" d="M1290,625 H1262"/>
<path class="a" d="M990,625 H962"/>
<path class="a" d="M715,625 H687"/>
<path class="a" d="M425,625 H397"/>

<rect class="store" x="65" y="702" width="160" height="50"/>
<text class="ts" x="145" y="733" style="font-size:16px">Incident record</text>
<rect class="store" x="240" y="702" width="155" height="50"/>
<text class="ts" x="317.5" y="733" style="font-size:16px">Decision log</text>
<path class="a" d="M145,675 V700"/>
<path class="a" d="M470,675 V727 H397"/>

<!-- Catalog growth -->
<rect class="bandbox" x="40" y="830" width="1520" height="180"/>
<path class="ad" d="M145,780 V878"/>
<text class="lbl" x="157" y="818">declines · rejections · hand fixes</text>
<text class="band" x="170" y="860">CATALOG GROWTH · FROM PRODUCTION EVIDENCE</text>
<text class="note" x="1360" y="860" text-anchor="end">the one place a model's code can run</text>

<rect class="py" x="65" y="880" width="260" height="100"/>
<text class="t" x="195" y="937">Gap signals</text>
<rect class="py" x="350" y="880" width="210" height="100"/>
<text class="t" x="455" y="937">Miner</text>
<rect class="agent" x="585" y="880" width="295" height="100"/>
<text class="t2 w" x="732.5" y="925">Three rungs,</text>
<text class="t2 w" x="732.5" y="949">cheapest first</text>
<rect class="py" x="905" y="880" width="310" height="100"/>
<text class="t2" x="1060" y="925">Proven in a sandbox</text>
<text class="t2" x="1060" y="949">before anyone is asked</text>
<rect class="human" x="1240" y="880" width="295" height="100"/>
<text class="t2 w" x="1387.5" y="925">Signed PR,</text>
<text class="t2 w" x="1387.5" y="949">or a one-shot</text>
<path class="a" d="M325,930 H348"/>
<path class="a" d="M560,930 H583"/>
<path class="a" d="M880,930 H903"/>
<path class="a" d="M1215,930 H1238"/>

<path class="ad" d="M1387.5,880 V798 H1125 V677"/>
<path class="ad" d="M1125,798 H555 V677"/>
<text class="lbl" x="1137" y="818">PR merged → provisional action</text>
<text class="lbl" x="567" y="818">one-shot → the manager's card</text>

<!-- Deployment -->
<rect x="40" y="1030" width="1520" height="56" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<rect x="58" y="1048" width="84" height="20" fill="#0f172a"/>
<text class="pill w" x="100" y="1062">DEPLOYED</text>
<text x="162" y="1064" style="font-size:15px;font-weight:600">AgentCore Runtime runs Tier 0  ·  AgentCore Identity  ·  DynamoDB  ·  Strands Agents  ·  Gemini on Vertex AI  ·  Slack Bolt</text>
</svg>
