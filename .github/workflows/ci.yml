name: ci

on:
  push:
  pull_request:

# The runner has no AWS credentials and no cluster. That is the point: this workflow is
# the standing proof that the fixture path needs neither, so a judge cloning the repo
# gets the same result CI does.
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAZEROPS_MODE: fixture
      FAZEROPS_LLM: stub
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # The suite imports every extra's SDK; `run_demo.sh` itself needs none of them.
      - run: uv sync --dev --extra slack --extra gemini --extra cluster

      - name: Zero-credential, zero-network suite
        # The three live markers need a cluster, AWS credentials or a GitHub token; the runner has none.
        run: uv run pytest -m "not cluster and not aws and not github" -q

      - name: Layer seam (plan §3.5 — never allowed to go red)
        run: uv run pytest tests/integration/test_layer_seam.py -q

      - name: Demo runs end to end on a clean checkout
        run: ./scripts/run_demo.sh

  # Phase G, W42: an agent-authored commit may not grant permissions (`_ACTIONS_FOR`), author a
  # tier, delete an action, or change the catalog without evidence the ledger's deployment
  # resolved and signed. Human commits are not checked — granting scope is their job. The
  # runner has no ledger, so it verifies the signature instead, with the same key held as a
  # secret; with the secret unset, every agent-authored catalog change fails (fail closed).
  catalog-growth:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      FAZEROPS_EVIDENCE_KEY: ${{ secrets.FAZEROPS_EVIDENCE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # The suite imports every extra's SDK; `run_demo.sh` itself needs none of them.
      - run: uv sync --dev --extra slack --extra gemini --extra cluster

      - name: Agent-authored commits grant nothing
        run: uv run python scripts/check_generated_pr.py commits --base "origin/$BASE_REF" --head HEAD

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The suite imports every extra's SDK; `run_demo.sh` itself needs none of them.
      - run: uv sync --dev --extra slack --extra gemini --extra cluster
      - run: uv run pytest tests/test_no_secrets.py -q

      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1
